# Builds the iPhone app and runs the unit tests on every push and pull request to main.
# This is an Xcode project (no Package.swift), so it uses xcodebuild, not swift build.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    # Pinned on purpose. "latest-stable" moved under us once and broke the
    # build. Bump this line when the app moves to a newer Xcode, and check
    # the runner image has it first:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
    - name: Use a pinned Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
    - name: Show Xcode version
      run: xcodebuild -version
    - name: Build
      run: >
        xcodebuild -project Spend.xcodeproj -scheme Spend
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO
        build
    - name: Make a simulator for the tests
      # The runner's iPhone models change with each Xcode, so pick the newest
      # iPhone and iOS runtime it has rather than naming one.
      run: |
        runtime=$(xcrun simctl list runtimes available -j | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier')
        device=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+ Pro$"))] | sort_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | last | .identifier')
        echo "Using $device on $runtime"
        echo "SIM_ID=$(xcrun simctl create ci-tests "$device" "$runtime")" >> "$GITHUB_ENV"
    - name: Test
      # ProStoreTests is skipped in CI: it depends on which simulator runtime
      # the runner has (it fails on iOS 26.x sims and passes on iOS 27, see
      # HANDOVER.md "StoreKit tests are simulator-dependent"). Run it locally
      # on an iOS 27 simulator instead.
      run: >
        xcodebuild -project Spend.xcodeproj -scheme Spend
        -destination "id=$SIM_ID"
        -skip-testing:SpendTests/ProStoreTests
        CODE_SIGNING_ALLOWED=NO
        test
