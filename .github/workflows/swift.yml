# Builds the iPhone app on every push and pull request to main.
# This is an Xcode project (no Package.swift), so it uses xcodebuild, not swift build.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use the newest Xcode on the runner
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Show Xcode version
      run: xcodebuild -version
    - name: Build
      run: >
        xcodebuild -project Spend.xcodeproj -scheme Spend
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO
        build
